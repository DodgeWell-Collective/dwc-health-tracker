name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The Cloudflare build also generates the binding types (.cloudflare/types) the typecheck needs.
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run build:node
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dwc-health-tracker .
